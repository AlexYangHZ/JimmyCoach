<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}JimmyCoach{% endblock %}</title>
    <script src="/static/htmx.min.js"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="app-header">
        <div class="header-inner">
            <a href="/" class="logo">🎓 Jimmy教练 · 七年级</a>
            <nav>
                <a href="/subjects/math/7">📐 数学</a>
                <a href="/subjects/english/7">🌐 英语</a>
                <a href="/subjects/chinese/7">📖 语文</a>
            </nav>
        </div>
    </header>

    <main class="app-main">
        {% block content %}{% endblock %}
    </main>

    <!-- Floating Chat Assistant (global) -->
    <div id="chat-float" class="chat-float collapsed">
        <div class="chat-float-header" onclick="toggleChat()">
            <span>💬 小教练 · 问我数学问题</span>
            <span class="chat-toggle-icon">▲</span>
        </div>
        <div class="chat-float-body">
            <div id="chat-float-messages" class="chat-float-messages"
                 hx-get="/chat/history"
                 hx-trigger="load"
                 hx-swap="innerHTML">
            </div>
            <form class="chat-float-form"
                  hx-post="/chat/send"
                  hx-target="#chat-float-messages"
                  hx-swap="beforeend"
                  hx-on::after-request="this.reset()">
                <input type="hidden" name="subject" value="math">
                <input type="hidden" name="grade" value="7">
                <textarea name="message" placeholder="输入你的数学问题..." rows="2" required></textarea>
                <button type="submit">发送</button>
            </form>
        </div>
    </div>

    <script>
    function toggleChat() {
        var el = document.getElementById('chat-float');
        el.classList.toggle('collapsed');
        var icon = el.querySelector('.chat-toggle-icon');
        icon.textContent = el.classList.contains('collapsed') ? '▲' : '▼';
    }
    </script>

    <footer class="app-footer">
        <p>Jimmy的学习伙伴 🤖 · 基于人教版七年级上册教材</p>
    </footer>
</body>
</html>
