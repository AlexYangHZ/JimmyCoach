{% extends "base.html" %}
{% block title %}{{ topic.title }} — Jimmy教练{% endblock %}

{% block content %}
<div class="lesson-container">
    <div class="breadcrumb">
        <a href="/">首页</a> → <a href="/subjects/{{ subject }}/{{ grade }}">{{ subject_name }}</a> → {{ topic.title }}
    </div>

    <!-- Textbook content — loaded from markdown -->
    <div class="lesson-content">
        <h2>{{ topic.code }} {{ topic.title }}</h2>
        <div class="textbook-content">
            {{ content_html | safe }}
        </div>
    </div>

    <!-- Exercises area (from curriculum YAML if available) -->
    <div id="exercises-area" class="exercises-section">
        <h2>📝 练习时间</h2>
        <div id="exercise-container"
             hx-get="/learn/{{ subject }}/{{ grade }}/{{ topic.id }}/exercises"
             hx-trigger="load"
             hx-swap="innerHTML">
            <p>加载练习题中...</p>
        </div>
    </div>

    <!-- Chat panel — RAG-based, subject-specific -->
    <div id="chat-panel" class="chat-panel">
        <div class="chat-header">
            💬 关于{{ subject_name }}的问题？基于教材内容回答
        </div>
        <div id="chat-messages" class="chat-messages"
             hx-get="/chat/history"
             hx-trigger="load"
             hx-swap="innerHTML">
        </div>
        <form class="chat-input-form"
              hx-post="/chat/send"
              hx-target="#chat-messages"
              hx-swap="beforeend"
              hx-on::after-request="this.reset()">
            <input type="hidden" name="topic_id" value="{{ topic.id }}">
            <input type="hidden" name="subject" value="{{ subject }}">
            <input type="hidden" name="grade" value="{{ grade }}">
            <input type="text" name="message" placeholder="问一个关于{{ subject_name }}的问题..." required autocomplete="off"
                   class="chat-input">
            <button type="submit" class="btn-send">发送</button>
        </form>
    </div>
</div>
{% endblock %}
