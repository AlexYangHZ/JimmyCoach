{% extends "base.html" %}
{% block title %}{{ section.title }} — Jimmy教练{% endblock %}

{% block content %}
<div class="lesson-container">
    <div class="breadcrumb">
        <a href="/">首页</a> → <a href="/subjects/{{ subject }}/{{ grade }}">{{ subject_name }}</a> → {{ section.title }}
    </div>

    <div class="lesson-header">
        <span class="section-badge">{{ section.chapter }}</span>
        <h2>{{ section.code }} {{ section.title }}</h2>
        <span class="page-count">📄 {{ section.pages }}页</span>
    </div>

    <!-- PDF Viewer -->
    <div class="pdf-viewer">
        <iframe src="{{ pdf_url }}#toolbar=1&navpanes=0"
                width="100%" height="700px"
                style="border: 1px solid #ddd; border-radius: 8px;">
        </iframe>
        <a href="{{ pdf_url }}" target="_blank" class="pdf-open-new">🔗 在新窗口打开PDF</a>
    </div>

    <!-- Exercises Section -->
    <div id="exercises-area" class="exercises-section">
        <h2>📝 练习题</h2>
        <div id="exercise-container"
             hx-get="/exercises/{{ section.id }}"
             hx-trigger="load"
             hx-swap="innerHTML">
            <div class="loading"><p>加载练习题中...</p><div class="spinner"></div></div>
        </div>
    </div>
</div>
{% endblock %}
