{% extends "base.html" %}
{% block title %}课程问答 — JimmyCoach{% endblock %}

{% block content %}
<div class="chat-page">
    <div class="chat-main">
        <div class="chat-messages" id="chat-msgs">
            <div class="chat-msg chat-msg-ai">
                <div class="chat-msg-avatar">🤖</div>
                <div class="chat-msg-bubble">
                    <p>你好 Jimmy！我是<strong>小教练</strong>，你的AI学习伙伴。</p>
                    <p>你可以问我任何学科的问题，比如：</p>
                    <ul>
                        <li>📐 正数和负数有什么区别？</li>
                        <li>🌐 "nice to meet you" 是什么意思？</li>
                    </ul>
                    <p>试试在下面输入你的问题吧！</p>
                </div>
            </div>
        </div>

        <form class="chat-input-bar" onsubmit="sendMsg(event)">
            <select id="chat-subject" class="chat-subject-select">
                <option value="">🌐 全部科目</option>
                {% for nav in nav_subjects %}
                <option value="{{ nav.id }}">{{ nav.icon }} {{ nav.name }}</option>
                {% endfor %}
            </select>
            <input type="text" id="chat-input" class="chat-input-field"
                   placeholder="输入你的问题..." required autocomplete="off">
            <button type="submit" id="chat-send-btn" class="chat-send-btn">发送</button>
        </form>
    </div>
</div>

<script>
function formatMD(text) {
    return text
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\n\n/g, '<br><br>')
        .replace(/\n/g, '<br>')
        .replace(/^- (.+)$/gm, '• $1');
}

function appendMsg(role, content) {
    var msgs = document.getElementById('chat-msgs');
    var avatar = role === 'user' ? '🧑' : '🤖';
    var cls = role === 'user' ? 'chat-msg-user' : 'chat-msg-ai';
    var div = document.createElement('div');
    div.className = 'chat-msg ' + cls;
    div.innerHTML = '<div class="chat-msg-avatar">' + avatar + '</div>'
        + '<div class="chat-msg-bubble">' + formatMD(content) + '</div>';
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
    return div;
}

function sendMsg(e) {
    e.preventDefault();
    var input = document.getElementById('chat-input');
    var msg = input.value.trim();
    if (!msg) return;

    var msgs = document.getElementById('chat-msgs');
    var subject = document.getElementById('chat-subject').value;
    var btn = document.getElementById('chat-send-btn');

    appendMsg('user', msg);
    input.value = '';
    btn.disabled = true;

    // AI bubble placeholder
    var aiDiv = document.createElement('div');
    aiDiv.className = 'chat-msg chat-msg-ai';
    aiDiv.innerHTML = '<div class="chat-msg-avatar">🤖</div>'
        + '<div class="chat-msg-bubble"><span class="typing-cursor">▌</span></div>';
    msgs.appendChild(aiDiv);
    msgs.scrollTop = msgs.scrollHeight;

    var form = new FormData();
    form.append('message', msg);
    form.append('subject', subject);

    fetch('/chat/stream', {method:'POST', body:form}).then(function(r){
        var reader = r.body.getReader();
        var decoder = new TextDecoder();
        var text = '';
        var bubble = aiDiv.querySelector('.chat-msg-bubble');
        function read() {
            reader.read().then(function(result){
                if (result.done) { btn.disabled = false; return; }
                var chunk = decoder.decode(result.value, {stream: true});
                var lines = chunk.split('\n');
                lines.forEach(function(line){
                    if (line.startsWith('data: ')){
                        try {
                            var data = JSON.parse(line.slice(6));
                            if (data.token) {
                                text += data.token;
                                bubble.innerHTML = formatMD(text) + '<span class="typing-cursor">▌</span>';
                            } else if (data.done) {
                                bubble.innerHTML = formatMD(text);
                                if (data.source) {
                                    var src = document.createElement('div');
                                    src.className = 'chat-msg-source';
                                    src.textContent = data.source;
                                    bubble.appendChild(src);
                                }
                            } else if (data.error) {
                                bubble.innerHTML = '<span style="color:#e74c3c">' + data.error + '</span>';
                            }
                        } catch(ex){}
                    }
                });
                msgs.scrollTop = msgs.scrollHeight;
                read();
            });
        }
        read();
    });
}

document.getElementById('chat-input').focus();
</script>
{% endblock %}
